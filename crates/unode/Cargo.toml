[package]
name = "unode"
edition.workspace = true
version.workspace = true

[features]
default = []
# Yellowstone gRPC (Triton / Riptide) live feed for recorder + trader
grpc = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto", "dep:tonic"]

[dependencies]
ucore = { path = "../ucore" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bs58.workspace = true
base64.workspace = true
rustc-hash.workspace = true
zstd.workspace = true
prost = "0.14"
mimalloc = { version = "0.1", default-features = false }
toml.workspace = true
ed25519-dalek.workspace = true
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots", "http2"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yellowstone-grpc-client = { version = "15", optional = true }
yellowstone-grpc-proto = { version = "14", optional = true, default-features = false, features = ["tonic"] }
tonic = { version = "0.14", optional = true }

[[bin]]
name = "recorder"
required-features = ["grpc"]

[[bin]]
name = "trader"
required-features = ["grpc"]

[[bin]]
name = "carstream"
required-features = ["grpc"]
