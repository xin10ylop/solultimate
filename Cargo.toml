[workspace]
resolver = "2"
members = ["crates/ucore", "crates/unode"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.13"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
curve25519-dalek = "4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rustc-hash = "2"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
